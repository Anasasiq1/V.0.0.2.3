version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hmq_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hmqin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hmqin_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hmqin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmqin"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: hmq_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-hmq_secure_encryption_key_2026}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-hmqin}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-hmqin}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-hmqin_secret}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
