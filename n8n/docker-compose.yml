version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_hyperlocal
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-n8n_secure_encryption_key_change_me}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      # Provider environment variables for workflows
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-EVOLUTION_API}
      - EVOLUTION_API_BASE_URL=${EVOLUTION_API_BASE_URL:-http://evolution_api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-your_evolution_api_key}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-hyperlocal_store}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - hyperlocal_net

  evolution_api:
    image: atendai/evolution-api:v1.8.2
    container_name: evolution_api_hyperlocal
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-your_evolution_api_key}
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - hyperlocal_net

volumes:
  n8n_data:
  evolution_instances:

networks:
  hyperlocal_net:
    driver: bridge
